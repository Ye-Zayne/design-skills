<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 12px;
      background: #fff;
      color: #1f1f1f;
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 12px;
      gap: 10px;
    }

    label {
      font-size: 11px;
      font-weight: 600;
      color: #595959;
      letter-spacing: 0.02em;
    }

    textarea {
      flex: 1;
      width: 100%;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      padding: 8px;
      font-size: 11px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      resize: none;
      outline: none;
      color: #1f1f1f;
      line-height: 1.5;
    }

    textarea:focus {
      border-color: #326bfb;
    }

    textarea.error {
      border-color: #ff4d4f;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    button {
      flex: 1;
      height: 32px;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 500;
    }

    .btn-primary {
      background: #326bfb;
      color: #fff;
    }

    .btn-primary:hover { background: #1a56e8; }
    .btn-primary:active { background: #1246cc; }

    .btn-secondary {
      background: #f5f5f5;
      color: #1f1f1f;
      border: 1px solid #d9d9d9;
    }

    .btn-secondary:hover { background: #ebebeb; }

    .status {
      font-size: 11px;
      min-height: 16px;
      color: #8c8c8c;
    }

    .status.error { color: #ff4d4f; }
    .status.success { color: #52c41a; }
    .status.running { color: #326bfb; }
  </style>
</head>
<body>
  <label>粘贴 DSL JSON</label>
  <textarea id="dsl" placeholder='{"schema":"figma-dsl","version":"1.0","page":{...},"sections":[...]}'></textarea>
  <div class="status" id="status"></div>
  <div class="actions">
    <button class="btn-secondary" id="btnClear">清空</button>
    <button class="btn-primary" id="btnImport">导入到 Figma</button>
  </div>

  <script>
    const textarea = document.getElementById('dsl');
    const status   = document.getElementById('status');

    function setStatus(msg, type) {
      status.textContent = msg;
      status.className = 'status ' + (type || '');
    }

    document.getElementById('btnClear').onclick = () => {
      textarea.value = '';
      textarea.classList.remove('error');
      setStatus('');
    };

    document.getElementById('btnImport').onclick = () => {
      textarea.classList.remove('error');
      setStatus('');

      let dsl;
      try {
        dsl = JSON.parse(textarea.value.trim());
      } catch (e) {
        textarea.classList.add('error');
        setStatus('JSON 格式错误：' + e.message, 'error');
        return;
      }

      if (!dsl || typeof dsl !== 'object' || Array.isArray(dsl) || dsl.schema !== 'figma-dsl') {
        textarea.classList.add('error');
        setStatus('无效的 DSL：schema 字段必须为 "figma-dsl"', 'error');
        return;
      }

      setStatus('正在导入...', 'running');
      document.getElementById('btnImport').disabled = true;

      parent.postMessage({ pluginMessage: { type: 'import', dsl } }, '*');
    };

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === 'success') {
        document.getElementById('btnImport').disabled = false;
        setStatus('导入完成：' + msg.text, 'success');
      } else if (msg.type === 'error') {
        document.getElementById('btnImport').disabled = false;
        setStatus('导入失败：' + msg.text, 'error');
      } else if (msg.type === 'progress') {
        setStatus(msg.text, 'running');
      }
    };
  </script>
</body>
</html>
